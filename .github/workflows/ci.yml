name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SQLite CLI
        run: sudo apt-get update && sudo apt-get install -y sqlite3
      - name: Run parser and loader tests
        run: make test
      - name: Validate public source manifest
        run: make validate-manifest
      - name: Validate SQLite schema
        run: make sqlite-smoke
